[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-graph-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "google-generativeai>=0.8.5",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langgraph>=0.2",
    "langsmith>=0.2",
    "neo4j>=5.20",
    "pandas>=2.2",
    "plotly>=5.0",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12",
    "streamlit>=1.28",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Real NVIDIA NeMo runtime (Python 3.10-3.13 only). Our app ships a
# Gemini-backed lightweight runtime so NeMo is NOT required to run.
nemo = ["nemoguardrails>=0.12"]

[tool.setuptools.packages.find]
include = ["src*"]
